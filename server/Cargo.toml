[package]
name = "tbw-server"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
bytes = "1.12.1"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
grib = { version = "0.19", default-features = false, features = ["png-unpack-with-png-crate", "ccsds-unpack-with-rust-aec", "jpeg2000-unpack-with-openjpeg", "time-calculation"] }
hex = "0.4.3"
lru = "0.18.5"
netcdf-reader = "0.9.1"
once_cell = "1.21.4"
parking_lot = "0.12.5"
rand = "0.10.3"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sysinfo = "0.39.6"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors", "compression-full", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.2"
